<script src="vendor/datatables/jquery.dataTables.min.js"></script>
<script src="vendor/datatables/dataTables.bootstrap4.min.js"></script>

<script>
$(document).ready(function () {
    var table = $('#dataTable').DataTable({
        processing: true,
        serverSide: true,
        language: {
            processing:   '처리 중...',
            search:       '검색:',
            lengthMenu:   '_MENU_ 건씩 보기',
            info:         '전체 _TOTAL_건 중 _START_ ~ _END_',
            infoEmpty:    '0건',
            infoFiltered: '(전체 _MAX_건 중 검색)',
            paginate: { first:'처음', last:'끝', next:'다음', previous:'이전' }
        },
        ajax: {
            url: '/data',
            dataSrc: 'data',
            data: function(d) {
                d.start  = d.start  || 0;
                d.length = d.length || 10;
            }
        },
        columns: [
            { data: 'Title' },
            {
                data: 'Date',
                render: function(data) {
                    if (!data) return '-';
                    return '<span class="badge badge-light text-dark">' + String(data).substring(0, 10) + '</span>';
                }
            },
            {
                data: 'Content',
                render: function(data) {
                    if (!data) return '-';
                    if (data.length > 120) {
                        var short = data.substring(0, 120) + '...';
                        return '<div class="content-preview">'
                             + '<span class="short-text">' + short + '</span>'
                             + '<span class="full-text d-none">' + data + '</span>'
                             + '<a href="#" class="toggle-view btn btn-link btn-sm p-0 ml-1">자세히</a>'
                             + '</div>';
                    }
                    return data;
                }
            },
            {
                data: 'Link',
                render: function(data) {
                    if (!data) return '-';
                    return '<a href="' + data + '" target="_blank" rel="noopener" class="btn btn-outline-primary btn-sm">'
                         + '<i class="fas fa-external-link-alt mr-1"></i>열기</a>';
                }
            }
        ],
        order: [[1, 'desc']],
        lengthMenu: [[10, 25, 50], [10, 25, 50]],
        pageLength: 10
    });

    // 자세히/접기 토글
    $('#dataTable').on('click', '.toggle-view', function(e) {
        e.preventDefault();
        var cp = $(this).closest('.content-preview');
        var st = cp.find('.short-text');
        var ft = cp.find('.full-text');
        if (ft.hasClass('d-none')) {
            st.addClass('d-none'); ft.removeClass('d-none'); $(this).text('접기');
        } else {
            ft.addClass('d-none'); st.removeClass('d-none'); $(this).text('자세히');
        }
    });

    // 기사 업데이트
    $('#updateButton').on('click', function() {
        $('#loadingOverlay').css('display', 'flex');
        $.ajax({
            url: '/run_script',
            method: 'GET',
            success: function() {
                alert('뉴스 업데이트가 완료되었습니다.');
                table.ajax.reload();
            },
            error: function() {
                alert('업데이트 중 오류가 발생했습니다.');
            },
            complete: function() {
                $('#loadingOverlay').hide();
            }
        });
    });
});
</script>

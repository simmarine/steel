<script>
// ── 모델 성능 데이터 ─────────────────────────────────────────
var MARKET_DATA = {
    days:       [10,   20,   30,   45,   60],
    accuracy:   [99.53, 96.23, 88.56, 83.63, 88.50],
    total:      [213,  212,  201,  226,  226],
    correct:    [212,  204,  178,  189,  220]
};

var SPECIAL_DATA = {
    days:       [10,   20,   30,   45,   60],
    accuracy:   [93.95, 89.60, 93.36, 84.75, 94.32],
    total:      [215,  202,  211,  223,  229],
    correct:    [202,  181,  197,  189,  216]
};

function getAccuracyClass(acc) {
    if (acc >= 90) return 'accuracy-high';
    if (acc >= 80) return 'accuracy-mid';
    return 'accuracy-low';
}

function buildChartCards(containerId, data, chartIdPrefix) {
    var container = document.getElementById(containerId);
    data.days.forEach(function(day, i) {
        var acc     = data.accuracy[i];
        var total   = data.total[i];
        var correct = data.correct[i];
        var cls     = getAccuracyClass(acc);
        var chartId = chartIdPrefix + i;

        var html = '<div class="col-md-12 mb-4">'
            + '<div class="card shadow">'
            + '<div class="card-header py-3 d-flex justify-content-between align-items-center">'
            + '<h6 class="m-0 font-weight-bold text-primary">'
            + '<i class="fas fa-clock mr-1"></i>' + day + '일 후 예측'
            + '</h6>'
            + '<div class="d-flex align-items-center stat-info">'
            + '<span class="mr-3 text-muted">'
            + '정답 <strong>' + correct + '</strong> / 전체 <strong>' + total + '</strong>'
            + '</span>'
            + '<span class="accuracy-badge ' + cls + '">Acc ' + acc + '%</span>'
            + '</div>'
            + '</div>'
            + '<div class="card-body">'
            + '<div class="chart-area"><canvas id="' + chartId + '"></canvas></div>'
            + '</div>'
            + '</div>'
            + '</div>';

        container.insertAdjacentHTML('beforeend', html);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    buildChartCards('marketPriceCharts',  MARKET_DATA,  'chart');
    buildChartCards('specialPriceCharts', SPECIAL_DATA, 'chart');
});
</script>
